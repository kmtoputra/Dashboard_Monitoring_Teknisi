{% extends "base.html" %}
{% block judul %}Ringkasan{% endblock %}
{% block isi %}

</div>
<div class="hitung" id="hitung"></div>
<div class="grid-unit" id="grid"><div class="kosong">Memuat data…</div></div>

{% endblock %}
{% block skrip %}<script src="{{ url_for('static', filename='js/kartu.js') }}?v={{ aset }}"></script>
